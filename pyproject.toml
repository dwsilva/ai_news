[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srag-report"
version = "0.1.0"
description = "Agente de geracao de relatorios sobre surtos de SRAG a partir da base do Open DATASUS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "langgraph>=0.2.40",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-text-splitters>=0.3",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "weasyprint>=62",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
srag = "srag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
srag = ["db/*.sql", "relatorio/templates/*.html", "api/static/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# O typer declara as opcoes da CLI como default do parametro; e a API da biblioteca,
# nao um default mutavel esquecido, que e o que o B008 procura.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
