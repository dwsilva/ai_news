services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-srag}
      POSTGRES_USER: ${POSTGRES_USER:-srag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srag}
    ports:
      # 5432 do host costuma estar ocupada por outro projeto
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srag} -d ${POSTGRES_DB:-srag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      # Opcional: so e preciso para a GOOGLE_API_KEY. O resto tem default aqui embaixo.
      - path: .env
        required: false
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SRAG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-srag}:${POSTGRES_PASSWORD:-srag}@db:5432/${POSTGRES_DB:-srag}
      SRAG_DATABASE_URL_LEITURA: postgresql+psycopg://srag_leitura:leitura@db:5432/${POSTGRES_DB:-srag}
    ports:
      - "8080:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./docs:/app/docs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
